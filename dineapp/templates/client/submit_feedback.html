{% extends 'client/base.html' %}

{% block title %}Submit Feedback - DineSmart{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6 mt-8">

    <h2 class="text-2xl font-semibold mb-4">Submit Feedback</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 text-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block mb-1 font-semibold" for="restaurantId">Restaurant ID</label>
            <input type="text" name="restaurantId" id="restaurantId" class="w-full p-2 border rounded" required>
        </div>

        <div>
            <label class="block mb-1 font-semibold" for="restaurantName">Restaurant Name</label>
            <input type="text" name="restaurantName" id="restaurantName" class="w-full p-2 border rounded" required>
        </div>

        <div>
            <label class="block mb-1 font-semibold" for="feedback">Feedback</label>
            <textarea name="feedback" id="feedback" rows="4" class="w-full p-2 border rounded" required></textarea>
        </div>

        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            Submit Feedback
        </button>
    </form>

</div>
{% endblock %}

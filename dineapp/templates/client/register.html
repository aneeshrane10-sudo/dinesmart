<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DineSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 m-2">
    <div class="flex justify-center items-center min-h-screen bg-cover bg-center">
        <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg backdrop-blur-md bg-opacity-90">
            <h2 class="text-3xl font-bold text-center text-green-600">Join DineSmart</h2>
            <p class="text-gray-600 text-center mb-6">Create an account to explore delicious food</p>

            {% if error_message %}
                <p class="text-red-500 text-center mt-2">{{ error_message }}</p>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-gray-700 font-medium">Username</label>
                    <input type="text" name="username" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium">Email</label>
                    <input type="email" name="email" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium">Phone Number</label>
                    <input type="text" name="phonenumber" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium">Password</label>
                    <input type="password" name="password" required class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-gray-700 font-medium">Profile Image (Optional)</label>
                    <input type="file" name="profile_image" accept="image/*" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:border-green-500">
                </div>

                <button type="submit" class="w-full bg-green-500 text-white py-3 rounded-md text-lg font-semibold hover:bg-green-600 transition">Register</button>
            </form>

            <p class="mt-4 text-center text-gray-600">
                Already have an account? <a href="{% url 'user_login' %}" class="text-green-500 font-semibold">Login here</a>
            </p>

            <div class="pt-8"><a href="{% url 'restaurantlogin' %}" class="text-center text-black">🛒 Restaurant Login</a></div>

        </div>
    </div>
</body>
</html>

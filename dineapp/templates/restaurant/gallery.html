{% extends 'restaurant/base.html' %}

{% block title %}Restaurant Gallery{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold">Restaurant Gallery</h1>

<!-- Upload New Image -->
<div class="bg-white p-6 rounded shadow mt-4">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label class="block font-semibold">Add New Image</label>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <input type="text" name="title" placeholder="Image Title" class="w-full p-2 border rounded-md mt-2" required>
            <input type="file" name="image" accept="image/*" class="w-full p-2 border rounded-md mt-2" required>
            <button type="submit" class="mt-3 bg-green-600 text-white p-2 rounded-md">➕ Upload</button>
        </div>
    </form>
</div>

<!-- Gallery Images -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6">
    {% for image in gallery %}
    <div class="bg-white p-3 rounded shadow-md">
        <img src="{{ image.baseimg }}" class="w-full h-32 object-cover rounded-md">
        <p class="text-center mt-2 font-semibold">{{ image.title }}</p>
        <form method="POST" action="{% url 'restaurantGalleryDelete' image.galleryid %}" class="mt-2">
            {% csrf_token %}
            <button type="submit" class="w-full text-red-500 font-bold hover:bg-red-300 p-2 rounded-md">🗑 Delete</button>
        </form>
    </div>
    {% endfor %}
</div>


{% endblock %}

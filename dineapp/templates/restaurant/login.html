<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
        <h2 class="text-2xl font-bold text-center text-green-600">Restaurant Login</h2>

        {% if error_message %}
            <p class="text-red-500 text-center mt-2">{{ error_message }}</p>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required class="w-full p-3 border rounded-md">
            <input type="password" name="password" placeholder="Password" required class="w-full p-3 border rounded-md">
            <button type="submit" class="w-full bg-green-500 text-white py-3 rounded-md">Login</button>
        </form>

        <p class="mt-4 text-center">
            Don't have an account? <a href="{% url 'restaurantregister' %}" class="text-green-500">Register</a>
        </p>

        <div class="pt-8"><a href="{% url 'user_login' %}" class="  text-center text-black">🤵 Customer Login</a></div>

    </div>

</body>
</html>
